# Mimics Supabase's API gateway for LOCAL TESTING only:
#  - maps /rest/v1/* to PostgREST;
#  - emulates what Supabase documents for the new sb_secret_ keys: sent in the apikey header only, then swapped
#    for a short-lived JWT upstream. This is an EMULATION of documented behaviour, not Supabase's real gateway.
map $http_apikey $upstream_authorization {
  "sb_secret_local_test_key" "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoibGFzLWxvY2FsLXRlc3QifQ.XvqWlSf556CGeNi1_bqv61z45F_E_tU9qDYLF46sPFE";
  default $http_authorization;
}
server {
  listen 80;
  location /rest/v1/ {
    proxy_pass http://postgrest:3000/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $upstream_authorization;
  }
}
